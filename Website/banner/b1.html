<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
.banner { background:#162E28; align-items:center; justify-content:center; }
.wrap { display:flex; align-items:center; gap:78px; padding:0 110px; }
.copy { text-align:left; }
.eyebrow { color:#7AAE86; margin-bottom:24px; }
.wordmark { font-size:100px; color:#FFFFFF; }
.wordmark em { font-style:italic; color:#A8CAB2; }
.rule { width:92px; background:#C07A5A; margin:28px 0 26px; }
.tag { font-size:27px; font-weight:300; line-height:1.55; color:rgba(255,255,255,.84); max-width:660px; }
.handle { color:#8FA89C; margin-top:32px; font-size:20px; }
.pwrap { position:relative; flex:none; width:330px; height:330px; }
.portrait { width:330px; height:330px; border:5px solid #7AAE86;
  filter:saturate(.72) contrast(1.02) sepia(.12); }
.ptint { position:absolute; inset:5px; border-radius:50%;
  background:rgba(22,46,40,.18); }
</style></head><body>
<div class="banner"><div class="wrap">
  <div class="copy">
    <p class="eyebrow">A Private Community</p>
    <h1 class="wordmark"><em>Go Happy</em><br>BELLY</h1>
    <hr class="rule">
    <p class="tag">Root-cause gut health for women who are<br>tired of being told they're fine.</p>
    <p class="handle">Alina Nazari, FDN-P &nbsp;·&nbsp; @gohappybelly</p>
  </div>
  <div class="pwrap"><img class="portrait" src="alina-head.jpg"><div class="ptint"></div></div>
</div></div></body></html>
